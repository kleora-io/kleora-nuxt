# Publishes this package to npm through trusted publishing: no token exists
# anywhere. The package's trusted publisher on npmjs.com names this repository
# and this file (`release.yml`). The job runs in the environment `npm`, which
# requires a maintainer's approval and accepts only `main`.
#
# npm's requirements for trusted publishing: a GitHub-hosted runner, npm CLI
# 11.5.1 or newer, Node 22.14 or newer, and `id-token: write`. Provenance is
# attached automatically because this repository is public.
#
# The version published is whatever `package.json` says; npm refuses a version
# that already exists, so bump it before running this.
name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or newer
        run: npm install -g npm@latest && npm --version
      - name: Publish
        run: npm publish --access public
